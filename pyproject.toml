[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turkiye-veri-mcp"
version = "0.32.0"
description = "MCP server for Turkish official data: TUIK, TCMB EVDS, BDDK and HMB in one place"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ahmet Hamza" }]
requires-python = ">=3.11"
keywords = ["tuik", "turkey", "statistics", "sdmx", "mcp", "model-context-protocol"]
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pyjstat>=2.4",
    "python-calamine>=0.3",
    "certifi",
]

[project.urls]
Repository = "https://github.com/ahmthamza/turkiye-veri-mcp"

[project.scripts]
turkiye-veri-mcp = "turkiye_veri_mcp.server:main"
turkiye-veri-audit = "turkiye_veri_mcp.audit:main"
turkiye-veri-probe = "turkiye_veri_mcp.probe:main"

[tool.hatch.build.targets.wheel]
packages = ["src/turkiye_veri_mcp"]
artifacts = ["src/turkiye_veri_mcp/certs/*.pem"]
