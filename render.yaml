# Render.com tek tıkla dağıtım (ücretsiz katman yeterli)
services:
  - type: web
    name: turkiye-veri-mcp
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: MCP_TRANSPORT
        value: http
      - key: TUIK_MAX_OBSERVATIONS
        value: "300000"   # ücretsiz katmanda (512 MB) bellek taşmasını önler
      - key: EVDS_API_KEY
        sync: false   # Render panelinden gizli değer olarak girilir
